name: CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Check whitespace and LFS pointers
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          git lfs fsck --pointers HEAD
          for script in Scripts/*.sh; do bash -n "$script"; done

  unreal:
    runs-on: [self-hosted, Windows, unreal]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Build editor
        shell: cmd
        run: Scripts\build-editor.bat
      - name: Run automation tests
        shell: pwsh
        run: |
          if (-not $env:UE_ROOT) { throw "Set UE_ROOT on the self-hosted runner." }
          $report = Join-Path $env:RUNNER_TEMP "FalemagAutomation"
          if (Test-Path $report) { Remove-Item -Recurse -Force $report }
          & "$env:UE_ROOT\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "$env:GITHUB_WORKSPACE\Falemag.uproject" -unattended -nop4 -nosplash -nullrhi '-ExecCmds=Automation RunTests Falemag' '-TestExit=Automation Test Queue Empty' "-ReportExportPath=$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content "$report\index.json" -Raw | ConvertFrom-Json
          if ($result.failed -gt 0 -or $result.succeeded -lt 1) { throw "Falemag automation tests failed or did not run." }
