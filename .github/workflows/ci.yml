name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache

jobs:
  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            flags: platform=linux arch=x86_64
          - name: windows-x86_64
            os: windows-latest
            flags: platform=windows arch=x86_64
          - name: android-arm64
            os: ubuntu-latest
            flags: platform=android arch=arm64 ndk_version=28.1.13356709
          - name: android-arm32
            os: ubuntu-latest
            flags: platform=android arch=arm32 ndk_version=28.1.13356709
          - name: web-wasm32
            os: ubuntu-latest
            flags: platform=web threads=no
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install SCons
        run: python -m pip install scons==4.9.1
      - name: Install Android NDK
        if: startsWith(matrix.name, 'android')
        run: |
          { yes 2>/dev/null || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.1.13356709" > /dev/null
      - name: Install Emscripten
        if: matrix.name == 'web-wasm32'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.20
          echo "EMSDK_ENV=$RUNNER_TEMP/emsdk/emsdk_env.sh" >> "$GITHUB_ENV"
      - name: Restore SCons cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scons-cache
          key: scons-${{ matrix.name }}-${{ hashFiles('.gitmodules', 'SConstruct') }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.name }}-${{ hashFiles('.gitmodules', 'SConstruct') }}-
            scons-${{ matrix.name }}-
      - name: Build debug and release libraries
        run: |
          if [ -n "${EMSDK_ENV:-}" ]; then source "$EMSDK_ENV"; fi
          scons -j4 ${{ matrix.flags }} target=template_debug
          scons -j4 ${{ matrix.flags }} target=template_release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falemag-${{ matrix.name }}
          path: |
            bin/*.so
            bin/*.dll
            bin/*.wasm
          if-no-files-found: error

  godot:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Check whitespace and LFS pointers
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          git lfs fsck --pointers HEAD
      - name: Download Linux library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: falemag-linux-x86_64
          path: bin
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
      - name: Import and test project
        run: |
          GODOT="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --import
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --script res://Tests/smoke_test.gd
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --quit-after 2

  android:
    needs: godot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
      - name: Cache Android export templates
        id: templates
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-android-templates-4.7.2-stable
      - name: Install Android export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/templates.tpz" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum --check
          DEST="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$DEST"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" templates/android_debug.apk templates/version.txt -d "$DEST"
          rm "$RUNNER_TEMP/templates.tpz"
      - name: Download native library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: falemag-android-arm64
          path: bin
      - name: Export debug APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          keytool -genkeypair -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          GODOT="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p build/android
          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --import
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/android/Falemag.apk"
          test -s build/android/Falemag.apk
          ls -l build/android/Falemag.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: falemag-android-debug
          path: build/android/Falemag.apk
          retention-days: 7
          if-no-files-found: error

  web:
    needs: godot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
      - name: Cache Web export templates
        id: templates
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-web-templates-4.7.2-stable
      - name: Install Web export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/templates.tpz" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum --check
          DEST="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$DEST"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" templates/web_dlink_nothreads_release.zip templates/version.txt -d "$DEST"
          rm "$RUNNER_TEMP/templates.tpz"
      - name: Download native library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: falemag-web-wasm32
          path: bin
      - name: Export Web build
        run: |
          GODOT="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p build/web
          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --import
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          test -s build/web/index.html
          test -s build/web/index.wasm
          du -sh build/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: falemag-web
          path: build/web
          retention-days: 7
          if-no-files-found: error
      - name: Upload GitHub Pages content
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build/web

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
