name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Check whitespace and LFS pointers
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          git lfs fsck --pointers HEAD
      - name: Install Godot 4.4.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          echo "d6e382fb531019f85630c1f485a561a0d20c4a2344b6c3847735cfee7da812aa  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
      - name: Import and test project
        run: |
          GODOT="$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --import
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --script res://Tests/smoke_test.gd
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --quit-after 2
